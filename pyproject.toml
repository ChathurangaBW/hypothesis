[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-pt"
version = "0.1.0"
description = "Stateful, invariant-driven application security investigation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1"]

[project.scripts]
hypothesis-pt = "hypothesis_pt.cli:main"

[tool.setuptools.packages.find]
include = ["hypothesis_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
hypothesis_pt = ["static/*.html"]
